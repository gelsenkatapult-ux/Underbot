name: Windows full application build

on:
  push:
    branches: [windows-port]
    tags: ["v*"]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test original Underbot GUI
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Restore OpenCV 3.4.2 build
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: |
            C:\mingw
            C:\opencv\build\install
          key: opencv-342-mingw63-x64-v2

      - name: Install original MinGW-w64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = Get-ChildItem C:\mingw -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $gcc) {
            $pathGcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
            if ($pathGcc) {
              $target = (& $pathGcc.Source -dumpmachine 2>$null | Select-Object -First 1).Trim()
              if ($target -eq 'x86_64-w64-mingw32') { $gcc = Get-Item $pathGcc.Source }
            }
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip --no-progress -y
            $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          }

          # The Qt archive mirror hosts an unmodified MinGW-w64 7.3.0
          # POSIX/SEH bundle. Try this direct mirror before SourceForge,
          # whose download endpoint sometimes returns an HTML challenge.
          if (-not $gcc) {
            $archive = Join-Path $env:RUNNER_TEMP 'mingw-w64-7.3.0.7z'
            try {
              Invoke-WebRequest -Uri 'https://download.qt.io/development_releases/prebuilt/mingw_64/x86_64-7.3.0-release-posix-seh-rt_v5-rev0.7z' -OutFile $archive -TimeoutSec 120
              $bytes = [System.IO.File]::ReadAllBytes($archive)
              $signature = ($bytes[0..5] | ForEach-Object { $_.ToString('X2') }) -join ''
              if ($bytes.Length -lt 30000000 -or $signature -ne '377ABCAF271C') { throw "Qt mirror did not return a valid 7z archive (bytes=$($bytes.Length), signature=$signature)." }
              New-Item -ItemType Directory -Force C:\mingw | Out-Null
              & $sevenZip x $archive '-oC:\mingw' -y
              if ($LASTEXITCODE -ne 0) { throw 'Could not extract the MinGW-w64 7.3.0 archive.' }
              $gcc = Get-ChildItem C:\mingw -Filter gcc.exe -Recurse | Select-Object -First 1
            } catch {
              Write-Warning "Qt MinGW mirror failed: $($_.Exception.Message)"
            }
          }

          # Fall back to the exact 6.3.0 compiler selected in GoCV's
          # historical Windows build script.
          if (-not $gcc) {
            $archive = Join-Path $env:RUNNER_TEMP 'mingw-w64-6.3.0.7z'
            $relative = 'Toolchains%20targetting%20Win64/Personal%20Builds/mingw-builds/6.3.0/threads-posix/seh/x86_64-6.3.0-release-posix-seh-rt_v5-rev1.7z'
            $mirrors = @(
              'https://netix.dl.sourceforge.net/project/mingw-w64',
              'https://phoenixnap.dl.sourceforge.net/project/mingw-w64',
              'https://pilotfiber.dl.sourceforge.net/project/mingw-w64',
              'https://psychz.dl.sourceforge.net/project/mingw-w64',
              'https://deac-riga.dl.sourceforge.net/project/mingw-w64',
              'https://delska.dl.sourceforge.net/project/mingw-w64',
              'https://downloads.sourceforge.net/project/mingw-w64'
            )
            $downloaded = $false
            foreach ($mirror in $mirrors) {
              try {
                Remove-Item $archive -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -Uri "$mirror/$relative" -OutFile $archive -Headers @{ 'User-Agent' = 'Underbot-Windows-Build/1.0' } -TimeoutSec 25
                $bytes = [System.IO.File]::ReadAllBytes($archive)
                $signature = ($bytes[0..5] | ForEach-Object { $_.ToString('X2') }) -join ''
                if ($bytes.Length -gt 30000000 -and $signature -eq '377ABCAF271C') {
                  $downloaded = $true
                  break
                }
                Write-Warning "$mirror returned an invalid 7z archive."
              } catch {
                Write-Warning "$mirror failed: $($_.Exception.Message)"
              }
            }
            if ($downloaded) {
              New-Item -ItemType Directory -Force C:\mingw | Out-Null
              & $sevenZip x $archive '-oC:\mingw' -y
              if ($LASTEXITCODE -ne 0) { throw 'Could not extract the pinned MinGW-w64 6.3.0 toolchain.' }
              $gcc = Get-ChildItem C:\mingw -Filter gcc.exe -Recurse | Select-Object -First 1
            }
          }

          # Last fallback: MSYS2 is already present on the windows-2022 image.
          if (-not $gcc -and (Test-Path 'C:\msys64\usr\bin\bash.exe')) {
            & 'C:\msys64\usr\bin\bash.exe' -lc 'timeout 120 pacman -Sy --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-make'
            if ($LASTEXITCODE -eq 0 -and (Test-Path 'C:\msys64\mingw64\bin\gcc.exe')) {
              $gcc = Get-Item 'C:\msys64\mingw64\bin\gcc.exe'
            }
          }

          if (-not $gcc) { throw 'No usable x86_64 MinGW compiler could be installed.' }
          $mingwBin = $gcc.Directory.FullName
          if (-not (Test-Path (Join-Path $mingwBin 'g++.exe'))) { throw 'The matching g++.exe compiler is missing.' }
          if (-not (Test-Path (Join-Path $mingwBin 'mingw32-make.exe'))) { throw 'The matching mingw32-make.exe is missing.' }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $mingwBin 'gcc.exe') --version
          & (Join-Path $mingwBin 'g++.exe') --version

      - name: Install CMake 3.13.5
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cmake-3.13.5.zip'
          Invoke-WebRequest -Uri 'https://cmake.org/files/v3.13/cmake-3.13.5-win64-x64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath C:\tools\cmake -Force
          $cmake = Get-ChildItem C:\tools\cmake -Filter cmake.exe -Recurse | Select-Object -First 1
          if (-not $cmake) { throw 'CMake 3.13.5 was not found after extraction.' }
          $cmake.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $cmake.FullName --version

      - name: Build the exact OpenCV 3.4.2 version required by GoCV 0.14
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force C:\opencv | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv/archive/3.4.2.zip' -OutFile C:\opencv\opencv-3.4.2.zip
          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv_contrib/archive/3.4.2.zip' -OutFile C:\opencv\opencv_contrib-3.4.2.zip
          Expand-Archive -LiteralPath C:\opencv\opencv-3.4.2.zip -DestinationPath C:\opencv -Force
          Expand-Archive -LiteralPath C:\opencv\opencv_contrib-3.4.2.zip -DestinationPath C:\opencv -Force
          $cmake = (Get-Command cmake.exe).Source
          & $cmake C:\opencv\opencv-3.4.2 -G 'MinGW Makefiles' -B C:\opencv\build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=C:\opencv\build\install -DENABLE_CXX11=ON -DOPENCV_EXTRA_MODULES_PATH=C:\opencv\opencv_contrib-3.4.2\modules -DBUILD_SHARED_LIBS=ON -DWITH_IPP=OFF -DWITH_MSMF=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_opencv_java=OFF -DBUILD_opencv_python=OFF -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF -DBUILD_DOCS=OFF -DENABLE_PRECOMPILED_HEADERS=OFF -DBUILD_opencv_saliency=OFF -DCPU_DISPATCH= -Wno-dev
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV 3.4.2 CMake configuration failed.' }
          & mingw32-make -C C:\opencv\build -j2
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV 3.4.2 compilation failed.' }
          & mingw32-make -C C:\opencv\build install
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV 3.4.2 installation failed.' }
          $required = @('C:\opencv\build\install\include\opencv2\core.hpp','C:\opencv\build\install\x64\mingw\lib\libopencv_core342.dll.a','C:\opencv\build\install\x64\mingw\bin\opencv_core342.dll')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing OpenCV build output: $file" } }

      - name: Validate cached OpenCV outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('C:\opencv\build\install\include\opencv2\core.hpp','C:\opencv\build\install\x64\mingw\lib\libopencv_core342.dll.a','C:\opencv\build\install\x64\mingw\bin\opencv_core342.dll')
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "Missing OpenCV build output: $file" } }

      - name: Set native compiler and OpenCV runtime path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mingwBin = $env:MINGW_BIN
          if (-not $mingwBin -or -not (Test-Path (Join-Path $mingwBin 'gcc.exe'))) {
            throw 'MinGW-w64 compiler path was not preserved from toolchain installation.'
          }
          if (-not (Test-Path (Join-Path $mingwBin 'g++.exe'))) {
            throw 'MinGW-w64 C++ compiler is missing.'
          }
          $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_CXXFLAGS=--std=c++11' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'C:\opencv\build\install\x64\mingw\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $mingwBin 'gcc.exe') --version

      - name: Download and verify original Go modules
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { throw 'Could not download pinned Go dependencies.' }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw 'Go module checksum verification failed.' }

      - name: Run all repository tests with CGO and OpenCV enabled
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'One or more repository tests failed.' }

      - name: Runtime smoke test for the pinned GoCV/OpenCV pair
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'underbot-opencv-smoke.go'
          @'
          package main
          import (
            "fmt"
            "gocv.io/x/gocv"
          )
          func main() {
            fmt.Printf("GoCV version: %s\n", gocv.Version())
            fmt.Printf("OpenCV version: %s\n", gocv.OpenCVVersion())
            if gocv.OpenCVVersion() != "3.4.2" {
              panic("unexpected OpenCV runtime version")
            }
          }
          '@ | Set-Content -LiteralPath $smoke -Encoding utf8
          go run $smoke
          if ($LASTEXITCODE -ne 0) { throw 'GoCV could not load and call the OpenCV runtime.' }

      - name: Build original Underbot GUI executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -o dist\Underbot.exe .
          if ($LASTEXITCODE -ne 0) { throw 'The full Underbot GUI build failed.' }
          go build -trimpath -o dist\Underbot-Windows-BackendCheck.exe .\cmd\winbackendcheck
          if ($LASTEXITCODE -ne 0) { throw 'The Windows backend diagnostic build failed.' }

      - name: Bundle runtime DLLs, notices and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $opencvBin = 'C:\opencv\build\install\x64\mingw\bin'
          $mingwBin = $env:MINGW_BIN
          if (-not $mingwBin -or -not (Test-Path (Join-Path $mingwBin 'gcc.exe'))) {
            throw 'Could not locate the selected MinGW runtime directory.'
          }
          Get-ChildItem $opencvBin -Filter '*.dll' | Copy-Item -Destination dist -Force
          $runtimeNames = @('libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll','libgomp-1.dll','libatomic-1.dll')
          foreach ($name in $runtimeNames) {
            $source = Join-Path $mingwBin $name
            if (Test-Path $source) { Copy-Item $source -Destination dist -Force }
          }
          foreach ($required in @('opencv_core342.dll','libstdc++-6.dll','libgcc_s_seh-1.dll','libwinpthread-1.dll')) {
            if (-not (Test-Path (Join-Path dist $required))) {
              throw "Required runtime DLL was not bundled: $required"
            }
          }
          New-Item -ItemType Directory -Force dist\licenses | Out-Null
          Copy-Item C:\opencv\opencv-3.4.2\LICENSE dist\licenses\OpenCV-LICENSE.txt
          if (Test-Path C:\opencv\opencv_contrib-3.4.2\LICENSE) { Copy-Item C:\opencv\opencv_contrib-3.4.2\LICENSE dist\licenses\OpenCV-Contrib-LICENSE.txt }
          @'
          Underbot for Windows (64-bit)

          This is the original Underbot application with a native Win32 window,
          capture and keyboard backend. The game logic has not been replaced.

          Run Underbot.exe with Undertale installed. Start Undertale first, then
          Shift-click the Undertale window when prompted. The selected game window
          must remain visible and in the foreground for desktop capture.

          OpenCV 3.4.2 and the MinGW runtime DLLs are bundled beside the executable.
          Keep all DLL files in the same folder as Underbot.exe.

          This build is compiler- and runtime-smoke-tested in GitHub Actions.
          A complete playthrough has not been certified by this automated build.
          '@ | Set-Content -LiteralPath dist\README-Windows.txt -Encoding utf8
          Get-FileHash dist\Underbot.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Underbot.exe" } | Set-Content -LiteralPath dist\SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path dist\* -DestinationPath Underbot-Windows-x64.zip -Force

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Underbot-Windows-x64
          path: Underbot-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub release for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows release bundle
        uses: actions/download-artifact@v4
        with:
          name: Underbot-Windows-x64
          path: release

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/Underbot-Windows-x64.zip
