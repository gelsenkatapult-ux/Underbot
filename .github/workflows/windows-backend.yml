name: Windows backend build

on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:

jobs:
  windows-backend:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Download backend dependency
        run: go mod download
      - name: Compile native Windows backend and smoke-test utility
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go test ./ai/... ./cv/rect ./sys/Impl
          go build -v ./sys/Impl ./winmanage ./cmd/winbackendcheck
          go build -o Underbot-Windows-BackendCheck.exe ./cmd/winbackendcheck
      - name: Upload Windows backend check
        uses: actions/upload-artifact@v4
        with:
          name: Underbot-Windows-BackendCheck
          path: Underbot-Windows-BackendCheck.exe
          if-no-files-found: error
